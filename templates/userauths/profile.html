<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color: #91e7d3;">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card" style="background-color: #ffffff; border: none; border-radius: 0.75rem; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);">
                    <div class="card-body" style="padding: 2rem;">
                        <h2 class="text-center mb-4" style="color: #343a40;">Profile</h2>
                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" id="username" name="username" class="form-control" value="{{ user.username }}" readonly>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" id="email" name="email" class="form-control" value="{{ user.email }}" readonly>
                            </div>
                            <!-- Additional profile fields can go here -->
                        </form>
                        <a href="{% url 'logout' %}" class="btn btn-danger w-100 mt-3">Logout</a>
                        <a href="{% url 'index' %}" class="btn btn-primary w-100 mt-3">Back to HomePage</a> <!-- New Button -->
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
