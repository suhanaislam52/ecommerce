<!-- templates/login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color: #7fb0e2;">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card" style="background-color: #ffffff; border: none; border-radius: 0.75rem; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);">
                    <div class="card-body" style="padding: 2rem;">
                        <h2 class="text-center mb-4" style="color: #343a40;">Login</h2>
                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                {{ form.username.label_tag }}
                                {{ form.username }}
                            </div>
                            <div class="mb-3">
                                {{ form.password.label_tag }}
                                {{ form.password }}
                            </div>
                            <button type="submit" class="btn btn-primary w-100" style="background-color: #007bff; border-color: #007bff;">Login</button>
                        </form>
                        <p class="text-center mt-3">Don't have an account? <a href="{% url 'register' %}" style="color: #007bff;">Register here</a>.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
