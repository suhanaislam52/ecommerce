<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Wishlist</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        .wishlist-item {
            border: 2px solid green;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .wishlist-item-info {
            display: flex;
            align-items: center;
        }
        .wishlist-item-info p {
            margin: 0 10px;
        }
        .remove-btn, .back-btn {
            background-color: green;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }
        .remove-btn:hover, .back-btn:hover {
            background-color: darkgreen;
        }
    </style>
</head>
<body>
    {% include 'core/header.html' %}

    <div class="container mt-5">
        <h1 class="font-weight-bold">Your Wishlist</h1>
        <div class="wishlist-items">
            {% for item in wishlist_items %}
            <div class="wishlist-item">
                <div class="wishlist-item-info">
                    <h3>{{ item.product.name }}</h3>
                    <p>Price: ${{ item.product.price }}</p>
                </div>
                <form method="post" action="{% url 'remove_from_wishlist' product_id=item.product.id %}">
                    {% csrf_token %}
                    <button type="submit" class="remove-btn">Remove</button>
                </form>
            </div>
            {% endfor %}
        </div>
        <a href="{% url 'category' %}" class="back-btn">Back to Categories</a>
    </div>

    {% include 'core/footer.html' %}
</body>
</html>
