<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swift Cart</title>
    <!-- Load static files -->
    {% load static %}
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .content {
            flex: 1;
        }
        .navbar-nav {
            text-align: center;
        }
        .navbar-nav .nav-item {
            display: inline-block;
        }
        .navbar-nav .nav-link {
            padding-left: 15px;
            padding-right: 15px;
        }
        .spacer {
            margin-top: 50px; /* Adjust this value to create the desired space */
        }
        .footer-social-icons a {
            display: block;
            margin-bottom: 5px; /* Add space between icons */
        }
        .card-container {
            position: relative;
            display: flex;
            overflow-x: auto;
        }
        .card-deck {
            display: flex;
            flex-direction: row;
        }
        .arrow-btn {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(255, 255, 255, 0.8);
            border: none;
            padding: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- Main Content -->
    <div class="content">
        <!-- Your main page content goes here -->
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4 mt-auto">
        <div class="container">
            <div class="row">
                <!-- Left Side: About Swift Cart -->
                <div class="col-md-4">
                    <h5>About Swift Cart</h5>
                    <p>
                        Swift Cart is your one-stop shop for all your needs. We offer a wide range of products, from food to fashion, and more, all at the best prices.
                    </p>
                </div>

                <!-- Center: Useful Links -->
                <div class="col-md-4 text-center">
                    <h5>Links</h5>
                    <ul class="list-unstyled">
                        <li><a href="{% url 'Deals' %}" class="text-white">Deals</a></li>
                        <li><a href="{% url 'category' %}" class="text-white">Category</a></li>
                        <li><a href="{% url 'Coupon1' %}" class="text-white">Coupons</a></li>
                        <li><a href="{% url 'Contact' %}" class="text-white">Contact Us</a></li>
                        <li><a href="{% url 'AboutUs' %}" class="text-white">About</a></li>
                    </ul>
                </div>

                <!-- Right Side: Social Media Links -->
                 <div class="col-md-4">
                     <h5>Follow Us</h5>
                    <div class="footer-social-icons">
                      <a href="https://www.facebook.com/swiftcart21/" class="text-white" target="_blank">
                       <i class="fab fa-facebook-f"></i> Facebook
                      </a>
                    <a href="https://www.instagram.com/swift.cart21/" class="text-white" target="_blank">
                       <i class="fab fa-instagram"></i> Instagram
                    </a>
                    <a href="https://x.com/SwiftCartHub?mx=2" class="text-white" target="_blank">
                      <i class="fab fa-twitter"></i> Twitter
                    </a>
                    </div>
                </div>

            </div>
        </div>
    </footer>

    <!-- jQuery (Full Version) -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <!-- Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.1/dist/umd/popper.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
